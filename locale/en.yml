stezkoy-telegram-notify:
  admin:
    connection_heading: Connection
    connection_intro: Credentials of the Telegram bot that will receive notifications.
    bot_token_label: Bot token
    bot_token_help: Get it from @BotFather on Telegram.
    chat_id_label: Chat ID
    chat_id_help: ID of the channel or group, e.g. -1001234567890 or @channelusername.
    proxy_label: Proxy (optional)
    proxy_help: Used when api.telegram.org is unreachable from your server. Formats socks5://host:port or http://host:port, auth via user:pass@host:port. Requires cURL.
    use_topic_switch: Send messages to a specific topic
    use_topic_help: Enable this for forum-style Telegram groups where messages are organized into topics.
    topic_id_label: Topic ID
    topic_id_help: Numeric ID of the topic (message_thread_id) in the group.
    templates_heading: Message templates
    templates_intro: Customize how notifications look in Telegram. Telegram HTML formatting is supported.
    new_discussion_label: New discussion template
    new_post_label: New post template
    placeholders_heading: Available placeholders
    examples_heading: Examples
    ex_minimal: just the link
    ex_compact: compact message
    ex_full: full card with tags and excerpt
    ex_button: labeled link instead of a raw URL
    ex_link_word: Go to topic
    ph_title: Discussion title
    ph_author: Author name
    ph_excerpt: First ~200 characters of the post content
    ph_url: Link to the discussion
    ph_tags: Tags separated by spaces (new discussions only)
    html_hint: Supported Telegram HTML tags
